<title>Родблок</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E2430'/%3E%3Ccircle cx='9' cy='16' r='4' fill='%2312B954'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23F2B300'/%3E%3Ccircle cx='23' cy='16' r='4' fill='%23F0213A'/%3E%3C/svg%3E">

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
img { max-width: 100%; }
/* План этажа: бумага с сеткой, чернильные стены, лампы вызова — единственный яркий акцент */
:root {
  --bg: #E7EDEB; --paper: #FFFFFF; --ink: #0A1820; --ink2: #1F3A47; --line: #2E4C5A; --grid: rgba(31, 58, 71, .09);
  --desk: #0E2430; --on-desk: #F3F8FA; --desk2: #1C3B49;
  --accent: #006A75; --on-accent: #FFFFFF;
  --ok: #08703D; --warn: #8F4F00; --bad: #B3101D; --violet: #5428C2; --pink: #A3104F;
  --lamp-g: #12B954; --lamp-y: #F2B300; --lamp-r: #F0213A; --lamp-off: #C3CED3;
  --ph-lat: #DDE8F0; --ph-act: #CBEDE3; --ph-pp: #F7DCE8;
  --dirty: #6E3F0C; --dirty-bg: #EBD6B4;
  --c-zav: #0A1820; --c-obst: #1B57CF; --c-anest: #6B32D9; --c-neo: #097F53; --c-reanim: #C4182A; --c-clean: #7D5800; --on-tok: #FFFFFF; --gold: #E1A400;
  --sheet: #FFFFFF; --scrim: rgba(4, 14, 20, .55);
  --f-ui: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-d: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-m: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A141A; --paper: #12222B; --ink: #F2F7F9; --ink2: #CFE1E8; --line: #8BB0BF; --grid: rgba(139, 176, 191, .09);
    --desk: #152E3A; --on-desk: #F3F8FA; --desk2: #2A4C5B;
    --accent: #45D3DD; --on-accent: #04161B;
    --ok: #45E08F; --warn: #FFB547; --bad: #FF6170; --violet: #B49BFF; --pink: #FF7AB0;
    --lamp-g: #2BE071; --lamp-y: #FFC933; --lamp-r: #FF4459; --lamp-off: #2C3E47;
    --ph-lat: #1D3442; --ph-act: #143F37; --ph-pp: #43203A;
    --dirty: #F3B565; --dirty-bg: #3D2B15;
    --c-zav: #F2F7F9; --c-obst: #6E9DFF; --c-anest: #B08BFF; --c-neo: #3DDC9C; --c-reanim: #FF6B79; --c-clean: #E6BA48; --on-tok: #06121A; --gold: #FFC533;
    --sheet: #12222B; --scrim: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A141A; --paper: #12222B; --ink: #F2F7F9; --ink2: #CFE1E8; --line: #8BB0BF; --grid: rgba(139, 176, 191, .09);
  --desk: #152E3A; --on-desk: #F3F8FA; --desk2: #2A4C5B;
  --accent: #45D3DD; --on-accent: #04161B;
  --ok: #45E08F; --warn: #FFB547; --bad: #FF6170; --violet: #B49BFF; --pink: #FF7AB0;
  --lamp-g: #2BE071; --lamp-y: #FFC933; --lamp-r: #FF4459; --lamp-off: #2C3E47;
  --ph-lat: #1D3442; --ph-act: #143F37; --ph-pp: #43203A;
  --dirty: #F3B565; --dirty-bg: #3D2B15;
  --c-zav: #F2F7F9; --c-obst: #6E9DFF; --c-anest: #B08BFF; --c-neo: #3DDC9C; --c-reanim: #FF6B79; --c-clean: #E6BA48; --on-tok: #06121A; --gold: #FFC533;
  --sheet: #12222B; --scrim: rgba(0, 0, 0, .62);
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 14px; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--desk); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [data-act]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--desk); color: var(--on-desk); }
.hud-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: grid; gap: 6px; }
.hud-row { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--f-d); font-weight: 800; font-size: 13px; letter-spacing: .08em; }
.clock { font-family: var(--f-m); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; }
.clock small { display: block; font-family: var(--f-ui); font-size: 11px; font-weight: 600; letter-spacing: .04em; opacity: 1; color: var(--on-desk); }
.speed { margin-left: auto; display: flex; gap: 4px; }
.speed button, .gear { min-width: 40px; height: 34px; border-radius: 6px; border: 1.5px solid var(--on-desk); background: transparent; color: var(--on-desk); font-weight: 700; font-size: 13px; font-family: var(--f-m); }
.speed button[aria-pressed="true"] { background: var(--on-desk); color: var(--desk); }
.gear { min-width: 34px; font-size: 16px; }
.stats { gap: 6px; }
.stat { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px; padding: 3px 6px; border: 1px solid var(--on-desk); border-radius: 5px; }
.stat b { font-family: var(--f-m); font-size: 15px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; font-weight: 600; }
.stat.vbi { flex: 1.4; align-items: center; }
.meter { flex: 1; height: 8px; border-radius: 4px; background: var(--desk2); border: 1px solid var(--on-desk); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--lamp-g); transition: width .4s; }

/* План этажа */
.board { position: relative; flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 14px; display: grid; gap: 8px;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; }
.wing { display: grid; gap: 6px; }
.w-priem { grid-template-columns: 1.25fr 1.75fr; }
.w-rd { grid-template-columns: 1fr 2fr; }
.w-bottom { grid-template-columns: repeat(4, 1fr); }
.room { position: relative; background: var(--paper); border: 1.5px solid var(--line); border-radius: 3px; padding: 5px 6px; min-width: 0; cursor: pointer; }
.lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); display: flex; justify-content: space-between; gap: 4px; align-items: center; }
.lift { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink2); letter-spacing: .05em; border-block: 1.5px dashed var(--line); padding-block: 2px; }
.sub { font-size: 12px; font-weight: 600; color: var(--ink); }
.queue { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; min-height: 18px; }
.qd { width: 16px; height: 16px; border-radius: 50%; background: var(--ph-act); border: 1.5px solid var(--line); }
.qd.hot { background: var(--lamp-r); border-color: var(--bad); }
.beds { display: grid; gap: 4px; margin-top: 4px; }
.beds.b2 { grid-template-columns: repeat(2, 1fr); }
.beds.b6 { grid-template-columns: repeat(3, 1fr); }
.bed { position: relative; height: 34px; border: 1.5px solid var(--line); border-radius: 3px; display: flex; align-items: center; justify-content: center; gap: 3px; background: var(--paper); cursor: pointer; }
.bed .lamps { position: absolute; top: 2px; right: 2px; }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.box { position: relative; min-height: 72px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 3px; padding: 3px 4px 4px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-width: 0; }
.bx-h { display: flex; justify-content: space-between; align-items: center; }
.bx-n { font-family: var(--f-m); font-size: 12px; font-weight: 700; }
.bx-b { flex: 1; display: flex; align-items: center; justify-content: center; }
.bx-f { display: flex; flex-wrap: wrap; gap: 2px; min-height: 13px; }
.dbar { height: 4px; border-radius: 2px; background: var(--lamp-off); overflow: hidden; }
.dbar i { display: block; height: 100%; background: var(--accent); }
.zone-tag { position: absolute; left: 3px; bottom: -1px; }
.dirty { background: repeating-linear-gradient(45deg, var(--dirty-bg) 0 5px, var(--paper) 5px 10px); }
.dirty-l { font-size: 10px; font-weight: 800; color: var(--dirty); text-transform: uppercase; letter-spacing: .04em; text-align: center; }
.post { background: var(--desk); color: var(--on-desk); border-color: var(--desk); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-align: center; }
.post b { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.post .cnt { font-family: var(--f-m); font-size: 18px; font-weight: 700; }
.post small { font-size: 10.5px; font-weight: 700; }

/* пациентка */
.pt { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-m); font-weight: 700; font-size: 13px; color: var(--ink); background: var(--ph-act); border: 2.5px solid var(--lamp-g); }
.pt.lat { background: var(--ph-lat); }
.pt.sec { background: var(--violet); color: var(--on-tok); }
.pt.pp { background: var(--ph-pp); font-size: 10px; }
.pt.em { background: var(--lamp-r); color: #fff; }
.pt.c-S { border-color: var(--lamp-y); }
.pt.c-P, .pt.c-B { border-color: var(--lamp-r); }
.pt.c-B { animation: blink .7s steps(2, start) infinite; }
.pt.sm { width: 22px; height: 22px; font-size: 11px; border-width: 2px; }
.tag { font-size: 9.5px; font-weight: 800; line-height: 1; padding: 2px 3px; border-radius: 2px; border: 1px solid currentColor; color: var(--ink2); }
.tag.r { color: var(--bad); } .tag.v { color: var(--violet); } .tag.o { color: var(--ok); } .tag.w { color: var(--warn); }

/* лампы вызова */
.lamps { display: inline-flex; gap: 3px; }
.lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--lamp-off); display: inline-block; }
.lamp.g.on { background: var(--lamp-g); } .lamp.y.on { background: var(--lamp-y); } .lamp.r.on { background: var(--lamp-r); }
.lamp.on.blink { animation: blink .8s steps(2, start) infinite; box-shadow: 0 0 0 2px var(--paper), 0 0 6px 1px currentColor; }
.lamp.g { color: var(--lamp-g); } .lamp.y { color: var(--lamp-y); } .lamp.r { color: var(--lamp-r); }
@keyframes blink { to { visibility: hidden; } }

/* бригада */
.tokens { position: absolute; inset: 0; pointer-events: none; }
.tok { position: absolute; left: 0; top: 0; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: var(--on-tok); border: 2px solid var(--paper); pointer-events: auto; cursor: pointer; transition-property: transform; transition-timing-function: linear; will-change: transform; z-index: 5; }
.tok.zav { background: var(--c-zav); color: var(--bg); border-color: var(--gold); width: 28px; height: 28px; margin: -14px 0 0 -14px; font-size: 8.5px; z-index: 6; }
.tok.obst { background: var(--c-obst); } .tok.anest { background: var(--c-anest); } .tok.neo { background: var(--c-neo); } .tok.reanim { background: var(--c-reanim); } .tok.clean { background: var(--c-clean); }
.tok.rest { opacity: .55; } .tok.away { display: none; }
.tok.tired::after { content: ""; position: absolute; right: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--lamp-y); border: 1.5px solid var(--paper); }

/* нижняя панель */
.dock { position: sticky; bottom: 0; z-index: 20; background: var(--desk); color: var(--on-desk); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px 8px; display: grid; gap: 6px; }
.tray, .staffbar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tray::-webkit-scrollbar, .staffbar::-webkit-scrollbar { display: none; }
.tray:empty::before { content: "Решений не ждут. Следи за лампами."; font-size: 12px; font-weight: 600; padding: 6px 0; }
.pill { flex: none; border: 1.5px solid var(--on-desk); background: transparent; color: var(--on-desk); border-radius: 16px; padding: 5px 10px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.pill.red { background: var(--lamp-r); border-color: var(--lamp-r); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
.pill.zv { background: var(--gold); border-color: var(--gold); color: #1A1200; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.chip { flex: none; width: 92px; text-align: left; border-radius: 6px; border: 1.5px solid var(--on-desk); background: transparent; color: var(--on-desk); padding: 4px 6px; display: grid; gap: 2px; }
.chip .cn { display: flex; gap: 5px; align-items: center; font-weight: 800; font-size: 12px; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1.5px solid var(--on-desk); }
.chip .cs { font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .en { height: 4px; border-radius: 2px; background: var(--desk2); border: 1px solid var(--on-desk); overflow: hidden; }
.chip .en i { display: block; height: 100%; background: var(--lamp-g); }
.chip.zav { border-color: var(--gold); }
.dot.zav { background: var(--c-zav); border-color: var(--gold); } .dot.obst { background: var(--c-obst); } .dot.anest { background: var(--c-anest); } .dot.neo { background: var(--c-neo); } .dot.reanim { background: var(--c-reanim); } .dot.clean { background: var(--c-clean); }

/* шторка и модалки */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 78vh; overflow-y: auto; background: var(--sheet); color: var(--ink); border-top: 2px solid var(--line); border-radius: 12px 12px 0 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; }
.modal { position: fixed; inset: 0; z-index: 42; display: flex; align-items: center; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)); }
.card { width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; background: var(--sheet); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.card.red { border-color: var(--bad); box-shadow: 0 0 0 4px color-mix(in srgb, var(--lamp-r) 35%, transparent); }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink2); }
.card.red .eyebrow { color: var(--bad); }
h2 { font-family: var(--f-d); font-weight: 800; font-size: 19px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; }
.who { font-size: 13px; font-weight: 600; color: var(--ink2); }
.clue { font-size: 15px; line-height: 1.45; margin: 0; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 11px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-size: 14.5px; font-weight: 600; line-height: 1.3; }
.opt:active { transform: translateY(1px); }
.fb { border-radius: 8px; padding: 10px 12px; border: 2px solid var(--ok); display: grid; gap: 6px; }
.fb.bad { border-color: var(--bad); }
.fb b { font-size: 15px; } .fb.ok b { color: var(--ok); } .fb.bad b { color: var(--bad); }
.btn { border: 0; border-radius: 8px; padding: 11px 16px; font-weight: 800; font-size: 15px; background: var(--accent); color: var(--on-accent); }
.btn.o { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { padding: 7px 10px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13.5px; }
.kv dt { font-weight: 700; color: var(--ink2); } .kv dd { margin: 0; font-weight: 600; }
.tasklist { display: grid; gap: 8px; }
.tk { border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
.tk.red { border-color: var(--bad); }
.tk-h { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; }
.need { font-size: 13px; font-weight: 600; }
.ctg { width: 100%; height: auto; display: block; border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); }
.ctg .gl { stroke: var(--grid); stroke-width: 1; } .ctg .gm { stroke: var(--ink2); stroke-width: .6; opacity: .45; }
.ctg .band { fill: var(--ph-act); opacity: .7; }
.ctg .fhr { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
.ctg .toco { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.ctg text { fill: var(--ink2); font-size: 9px; font-family: var(--f-m); font-weight: 700; }
.legend { display: grid; gap: 6px; font-size: 13.5px; }
.legend div { display: flex; gap: 8px; align-items: center; }
.toasts { position: fixed; z-index: 35; top: calc(env(safe-area-inset-top, 0px) + 92px); left: 0; right: 0; display: grid; justify-items: center; gap: 6px; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { max-width: 520px; width: 100%; background: var(--sheet); color: var(--ink); border: 2px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; animation: tin .25s ease-out; }
.toast i { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--accent); }
.toast.bad { border-color: var(--bad); } .toast.bad i { background: var(--lamp-r); }
.toast.good i { background: var(--lamp-g); } .toast.warn { border-color: var(--warn); } .toast.warn i { background: var(--lamp-y); }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } }
.big { font-family: var(--f-d); font-weight: 800; font-size: 34px; letter-spacing: .04em; line-height: 1; margin: 0; }
.stars { font-size: 26px; letter-spacing: 4px; color: var(--gold); }
.rep { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.rep span { overflow-wrap: anywhere; }
.rep div { border: 1.5px solid var(--line); border-radius: 6px; padding: 6px; display: grid; }
.rep b { font-family: var(--f-m); font-size: 18px; } .rep span { font-size: 11.5px; font-weight: 700; color: var(--ink2); }
.revl { display: grid; gap: 6px; font-size: 13px; }
.revl div { border-bottom: 1px solid var(--grid); padding-bottom: 6px; }
.ok-t { color: var(--ok); font-weight: 800; } .bad-t { color: var(--bad); font-weight: 800; }
.switch { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .tok { transition: none !important; } .lamp.on.blink, .pill.red, .pt.c-B { animation: none; } .toast { animation: none; } }

/* ---------- персонал ---------- */
function sendTo(s, loc, fast) {
  if (!loc) return;

  let tt = travelTime(s.loc, loc);
  if (fast) tt = Math.max(1, Math.round(tt * 0.6));
  if (s.energy < 30) tt = Math.max(1, Math.round(tt * 1.25));
  s.dest = loc; s.depart = S.t; s.eta = S.t + tt; s.state = 'walk';
}
function fits(role, need) {

}

}

}

}
function addTask(o) {

}
function closeTask(tk) {

}

    if (keep && keep.includes(tk.type)) continue;
    closeTask(tk);
  }
}
function present(tk, roles) {
  if (!tk) return false;
  for (const n in tk.slots) for (const id of tk.slots[n]) {
    const s = staffBy(id);
    if (s && s.state === 'work' && s.loc === tk.loc && (!roles || roles.includes(s.role))) return true;
  }
  return false;
}
function allPresent(tk) {
  for (const n in tk.need) {

    for (const id of arr) { const s = staffBy(id); if (!s || s.state !== 'work' || s.loc !== tk.loc) return false; }
  }

}
function teamRate(tk) {

  return r;
}

/* ---------- автораспределение: дежурные сами бегут на кнопки ---------- */
function costOf(s, tk, need) {
  let c = travelTime(s.state === 'walk' ? s.dest : s.loc, tk.loc) + (100 - s.energy) / 20;

  if (need === 'neo' && s.role === 'reanim') c += 8;
  return c;
}
function freePool(need, tk) {
  return S.staff.filter(s => s.role !== 'zav' && s.role !== 'pmu' && fits(s.role, need) && !s.taskId && s.state !== 'away' && (s.state !== 'rest' || tk.pri >= 3 || s.energy >= 85));
}
function dispatch() {
  const list = openTasks().filter(tk => S.t >= tk.callAt).sort((a, b) => b.pri - a.pri || a.created - b.created);
  for (const tk of list) {
    const pp = tk.pid ? pat(tk.pid) : null;
    if (pp && pp.pmu) pmuFill(tk, pp);
    const m = missing(tk);
    for (const need in m) {
      if (need === 'zav') continue;
      if (need === 'obst' && pp && pp.pmu && pp.flags.waitDoc) continue;
      if (need !== 'clean' && !S.auto) continue;
      for (let k = 0; k < m[need]; k++) {
        let c = freePool(need, tk);
        if (!c.length && tk.pri >= 3) c = S.staff.filter(s => s.role !== 'zav' && s.role !== 'pmu' && fits(s.role, need) && s.taskId && task(s.taskId) && task(s.taskId).pri <= 1 && s.state !== 'away');
        if (!c.length) break;
        c.sort((a, b) => costOf(a, tk, need) - costOf(b, tk, need));
        const s = c[0];
        if (s.taskId) { const old = task(s.taskId); note(s.name + ' ' + he(s, 'снят', 'снята') + ' с «' + (old ? old.label : '') + '» → ' + tk.label, 'warn'); }

}
/* ручное управление (зав командует) */
function needFor(s, tk) {

}
function manualAssign(staffId, taskId) {

  const need = needFor(s, tk);

}
function sendRest(id) { const s = staffBy(id); if (!s || s.state === 'away') return; if (s.taskId) unassign(s); s.rest = true; s.forced = true; if (s.loc === 'ord' && s.state !== 'walk') s.state = 'rest'; else sendTo(s, 'ord'); }

function release(id) { const s = staffBy(id); if (s && s.taskId) unassign(s); }

function staffTick() {
  const night = isNight();
  for (const s of S.staff) {
    if (s.state === 'away') { if (S.t >= s.awayUntil) { s.state = 'idle'; note(s.role === 'pmu' ? 'Врач ПМУ ' + s.name + ' ' + he(s, 'приехал', 'приехала') : s.name + ' ' + he(s, 'вернулся', 'вернулась') + ' в родблок'); } continue; }

      s.loc = s.dest; s.dest = null;
      s.state = s.taskId ? 'work' : (s.rest && s.loc === 'ord') ? 'rest' : 'idle';
    }
    let d = s.state === 'rest' ? 0.33 * S.mod.rest : s.state === 'work' ? -0.085 : s.state === 'walk' ? -0.05 : -0.02;

    if (S.auto && s.role !== 'zav' && s.role !== 'pmu' && s.state === 'idle' && !s.taskId && s.energy < 25 && !s.rest) { s.rest = true; sendTo(s, 'ord'); if (s.loc === 'ord') s.state = 'rest'; }
  }

}

/* ---------- задачи ---------- */
function tasksTick() {
  for (const tk of openTasks()) {
    if (tk.type === 'birth') { birthTick(tk); continue; }
    if (allPresent(tk)) {
      if (!tk.started) { tk.started = true; tk.startT = S.t; if (START[tk.type]) START[tk.type](tk); }
      tk.prog += teamRate(tk);

    }
    if (tk.deadline != null && !tk.late && !tk.started && S.t > tk.deadline) { tk.late = true; if (LATE[tk.type]) LATE[tk.type](tk); }
    if (tk.failAt != null && !tk.started && S.t >= tk.failAt && !tk.done) { if (FAIL[tk.type]) FAIL[tk.type](tk); else closeTask(tk); }

}

/* ---------- чистота ---------- */
function dirtyRooms() { return BED_IDS.filter(id => S.rooms[id].dirty); }

}

function vbiTick() {

/* ---------- главный такт: 1 игровая минута ---------- */
function tick() {
  if (S.over) return;
  SEED = S.rng;
  S.t++;
  laterTick();
  arrivalsTick();
  queueTick();
  for (const p of livePatients()) { laborTick(p); wardTick(p); }
  placeTick();
  staffTick();
  dispatch();
  tasksTick();
  decisionsTick();
  vbiTick();

function laterTick() {

/* ===== РОДБЛОК · движок: пациентки и роды ===== */

    id: ++S.uid, name: pick(SURN), age: rint(19, 42), multip, para: multip ? rint(1, 3) : 0,

  }
  let g = `<rect class="band" x="0" y="${y(160)}" width="${W}" height="${(y(110) - y(160)).toFixed(1)}"/>`;
  for (let m = 1; m < 10; m++) g += `<line class="gl" x1="${m * 32}" y1="${top}" x2="${m * 32}" y2="${tTop + th}"/>`;
  for (const v of [60, 90, 120, 150, 180, 210]) g += `<line class="gm" x1="0" y1="${y(v)}" x2="${W}" y2="${y(v)}"/><text x="2" y="${(+y(v) - 2).toFixed(1)}">${v}</text>`;
  g += `<line class="gm" x1="0" y1="${tTop}" x2="${W}" y2="${tTop}"/><text x="2" y="${tTop + 10}">схватки</text>`;
  return `<svg class="ctg" viewBox="0 0 ${W} ${tTop + th + 4}" role="img" aria-label="Фрагмент КТГ, 10 минут">${g}<polyline class="fhr" points="${f.join(' ')}"/><polyline class="toco" points="${c.join(' ')}"/></svg>`;
}

/* ---------- модалки ---------- */
function showModal(h) { $('scrim').hidden = false; const m = $('modal'); m.hidden = false; m.innerHTML = h; const b = m.querySelector('button'); if (b) b.focus({ preventScroll: true }); }
function closeModal() {
  UI.modal = null; $('modal').hidden = true; $('modal').innerHTML = '';
  if (!UI.open) $('scrim').hidden = true;
  if (!nextModal(false) && UI.autoPaused) { UI.autoPaused = false; setSpeed(UI.prevSpeed || 1); }
}
function openDecision(id) {
  const d = S.decisions.find(x => x.id === id); if (!d || d.done) return;
  const v = decisionView(d); if (!v) return;
  UI.modal = { kind: 'dec', id };
  showModal(`<div class="card${v.red ? ' red' : v.pop ? ' gold' : ''}"><div class="eyebrow">${esc(v.where)}${v.red ? ' · красная кнопка' : v.pop ? ' · врач ПМУ' : ''} · ${clock(S.t)}</div><h2>${esc(v.title)}</h2><div class="who">${esc(v.who)}</div>${v.ctg ? ctgSVG(v.ctg, d.id) : ''}<p class="clue">${esc(v.clue)}</p>${v.fact ? `<p class="who">${esc(v.fact)}</p>` : ''}<div class="opts">${v.options.map((o, i) => `<button type="button" class="opt" data-act="choose" data-id="${d.id}" data-i="${i}">${esc(o.label)}</button>`).join('')}</div><button type="button" class="btn o sm" data-act="later" data-id="${d.id}">Решу позже</button></div>`);
}
function showFeedback(res) {
  const m = $('modal').querySelector('.card'); if (!m) return closeModal();
  m.querySelector('.opts').outerHTML = `<div class="fb ${res.ok ? 'ok' : 'bad'}"><b>${res.ok ? 'Верно' : 'Не лучший выбор'}</b><span>${esc(res.why)}</span>${res.best ? `<span><b>Правильнее:</b> ${esc(res.best)}</span>` : ''}</div>`;
  const later = m.querySelector('[data-act="later"]');
  later.outerHTML = '<button type="button" class="btn" data-act="closeModal">Дальше</button>';
  m.querySelector('[data-act="closeModal"]').focus({ preventScroll: true });
}
function openEvent(c) {
  UI.modal = { kind: 'ev', id: c.id }; UI.shownModals[c.id] = true;
  const btns = c.choices ? c.choices.map((t, i) => `<button type="button" class="opt" data-act="evch" data-id="${c.id}" data-i="${i}">${esc(t)}</button>`).join('') : '<button type="button" class="btn" data-act="closeModal">Понятно</button>';
  showModal(`<div class="card${c.k && c.k.startsWith('boss') ? ' red' : ''}"><div class="eyebrow">${c.k && c.k.startsWith('boss') ? 'Босс' : 'Событие'} · ${clock(S.t)}</div><h2>${esc(c.title)}</h2><p class="clue">${esc(c.text)}</p><div class="opts">${btns}</div></div>`);
}
function nextModal(auto) {
  if (UI.modal) return true;
  const red = S.decisions.find(d => !d.done && (d.red || d.pop) && !UI.deferred[d.id]);
  if (red) { openDecision(red.id); return true; }
  const ev = S.modals.find(m => !UI.shownModals[m.id]);
  if (ev) { if (ev.type === 'report') { UI.shownModals[ev.id] = true; openReport(); } else openEvent(ev); return true; }
  return false;
}
function openReport() {
  UI.modal = { kind: 'rep' }; setSpeed(0);
  const st = S.st, F = S.final;
  let best = 0; try { best = +localStorage.getItem('rodblok-best') || 0; if (S.score > best) localStorage.setItem('rodblok-best', String(Math.round(S.score))); } catch (e) { }
  const cell = (b, s) => `<div><b>${b}</b><span>${s}</span></div>`;
  const rev = S.review.filter(x => x.byZav && !x.ok).slice(-8);
  showModal(`<div class="card"><div class="eyebrow">Сдача смены · 08:00</div><p class="big">${Math.round(S.score)}</p><div class="stars" aria-label="${F.stars} из 3">${'★'.repeat(F.stars)}${'☆'.repeat(3 - F.stars)}</div><h2>${esc(F.title)}</h2>${best ? `<div class="who">Прошлый рекорд: ${best}</div>` : ''}
  <div class="rep">${cell(st.births, 'родов')}${cell(Math.round(F.csRate * 100) + '%', 'доля КС')}${cell(st.vep, 'ВЭП')}${cell(st.csEm, 'экстренных КС')}${cell(st.csNeedless, 'КС без показаний')}${cell(st.pph, 'ПРК')}${cell(st.kas, 'КАС')}${cell(st.asph, 'асфиксий')}${cell(st.oritn, 'в ОРИТН')}${cell(st.chorio, 'хориоамнионитов')}${cell(Math.round(S.vbiPeak), 'пик ВБИ')}${cell(st.palata, 'родов вне бокса')}${cell(st.noDoc, 'родов без врача')}${cell(st.complaints, 'жалоб')}${cell(st.decOk + '/' + st.decAll, 'верных решений')}${cell((st.bossWon || 0) + '/' + (S.waves ? S.waves.length : 0), 'боссов повержено')}${cell(st.arrivals, 'поступило')}${cell(st.maxQueue, 'макс. очередь')}${cell(st.pmuBirths || 0, 'контрактных родов')}${cell(st.pmuStopped || 0, 'абсурда остановлено')}${cell(st.pmuMissed || 0, 'абсурда пропущено')}</div>
  ${F.bonus.length ? `<div class="who"><b>Бонусы:</b> ${esc(F.bonus.join(' · '))}</div>` : ''}
  ${rev.length ? `<h3>Разбор ошибок</h3><div class="revl">${rev.map(x => `<div><span class="bad-t">${clock(x.t)} ${esc(x.where)} · ${esc(x.title)}</span><br>Выбрано: ${esc(x.choice)}<br>Правильнее: ${esc(x.best || '')}<br>${esc(x.why)}</div>`).join('')}</div>` : '<div class="who">Ошибок в решениях нет.</div>'}
  <button type="button" class="btn" data-act="restart">Новая смена</button></div>`);
}
function showStart() {
  UI.modal = { kind: 'start' };
  showModal(`<div class="card"><div class="eyebrow">Сутки дежурства · 19 боксов</div><p class="big">РОДБЛОК</p><div class="who">Ты — заведующий. С 08:00 до 08:00: три акушера, три анестезиолога, два неонатолога, два реаниматолога, пять акушерок и клининг.</div>${rulesHTML()}<label class="switch"><input type="checkbox" id="optAuto0" data-act="toggle" data-k="auto"${S.auto ? ' checked' : ''}> Дежурные сами бегут на кнопки</label><button type="button" class="btn" data-act="start">Принять смену</button></div>`);
}

/* ---------- скорость и цикл ---------- */
function setSpeed(v) { UI.speed = v; if (v > 0) UI.prevSpeed = v; UI.dirty = true; }
let lastTs = 0, acc = 0;
function frame(ts) {
  const dt = lastTs ? Math.min(250, ts - lastTs) : 0; lastTs = ts;
  if (UI.speed > 0 && !S.over && UI.started) {
    acc += dt * UI.speed;
    let n = 0;
    while (acc >= UI.msPerMin && n < 8) { acc -= UI.msPerMin; tick(); n++; UI.dirty = true; if (S.pauseReq) break; }
    if (S.pauseReq) {
      S.pauseReq = false; acc = 0;
      const auto = S.autoPause || S.over;
      if (auto && !UI.modal && (S.decisions.some(d => !d.done && (d.red || d.pop) && !UI.deferred[d.id]) || S.modals.some(m => !UI.shownModals[m.id]))) { UI.prevSpeed = UI.speed; UI.autoPaused = true; setSpeed(0); nextModal(true); }
    }
  }
  if (!UI.modal && UI.started && (S.over || UI.speed === 0 || !S.autoPause)) {
    if (S.modals.some(m => !UI.shownModals[m.id] && (m.type === 'report' || !S.autoPause))) nextModal(false);
  }
  if (UI.dirty) { render(); UI.dirty = false; }
  requestAnimationFrame(frame);
}
function startGame() { UI.started = true; closeModal(); setSpeed(1); }
function restart() {
  newGame(); UI.built = false; UI.deferred = {}; UI.shownModals = {}; UI.seenNote = 0; UI.open = null; UI.modal = null;
  $('sheet').hidden = true; $('modal').hidden = true; $('scrim').hidden = true;
  buildBoard(); setSpeed(0); UI.started = false; render(); showStart();
}

/* ---------- ввод ---------- */
document.addEventListener('pointerdown', () => { UI.down = true; });
document.addEventListener('pointerup', () => { UI.down = false; });
document.addEventListener('pointercancel', () => { UI.down = false; });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'toggle') { S[el.dataset.k] = el.checked; UI.dirty = true; return; }
  switch (a) {
    case 'speed': setSpeed(+el.dataset.v); UI.autoPaused = false; break;
    case 'settings': openSheet({ kind: 'settings' }); break;
    case 'room': openSheet({ kind: 'room', loc: el.dataset.loc }); break;
    case 'post': openSheet({ kind: 'post' }); break;
    case 'log': openSheet({ kind: 'log' }); break;
    case 'staff': openSheet({ kind: 'staff', id }); break;
    case 'send': { const ok = manualAssign(el.dataset.staff, +el.dataset.task); if (!ok) note('Этот сотрудник туда не подходит', 'warn'); else if (UI.open && UI.open.kind === 'staff') closeSheet(); refreshSheet(true); break; }
    case 'zavgo': manualAssign('zav', +el.dataset.task); break;
    case 'rest': sendRest(id); refreshSheet(true); break;
    case 'wake': wake(id); refreshSheet(true); break;
    case 'free': release(id); refreshSheet(true); break;
    case 'pmuoff': pmuDismiss(id); refreshSheet(true); break;
    case 'clean': callCleaning([el.dataset.loc]); refreshSheet(true); break;
    case 'cleanall': { const n = callCleaning(dirtyRooms()); note(n ? 'Клининг вызван: ' + n : 'Всё уже в очереди', 'good'); refreshSheet(true); break; }
    case 'dec': closeSheet(); if (!UI.modal) openDecision(+id); break;
    case 'choose': { const res = decide(+id, +el.dataset.i); if (res) showFeedback(res); else closeModal(); break; }
    case 'later': UI.deferred[+id] = true; closeModal(); break;
    case 'evch': eventChoice(+id, +el.dataset.i); closeModal(); break;
    case 'closeModal': closeModal(); break;
    case 'close': if (UI.open) closeSheet(); else if (UI.modal && UI.modal.kind !== 'start' && UI.modal.kind !== 'rep') closeModal(); break;
    case 'start': startGame(); break;
    case 'restart': restart(); break;
  }
  UI.dirty = true;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[tabindex="0"][data-act]')) { e.target.click(); return; }
  if (UI.modal || e.target.closest && e.target.closest('input')) return;
  if (e.key === ' ') { e.preventDefault(); setSpeed(UI.speed ? 0 : UI.prevSpeed || 1); }
  else if (e.key === '1' || e.key === '2' || e.key === '4') setSpeed(+e.key);
  else if (e.key === 'Escape' && UI.open) closeSheet();
});
window.addEventListener('resize', () => { UI.tokPos = {}; placeTokens(true); });

/* ---------- запуск ---------- */
function boot(data) {
  if (data && data.S && data.S.v === 2) { S = data.S; SEED = S.rng; UI.started = !!data.started; }
  else newGame();
  buildBoard(); render(); placeTokens(true);
  if (!UI.started) showStart(); else setSpeed(0);
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({ S, started: UI.started })); } catch (e) { }
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
</script>
</body>
